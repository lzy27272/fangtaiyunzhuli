    SimulationHotelView:
      type: object
      additionalProperties: false
      required:
        - tenantId
        - hotelId
        - tenantCode
        - tenantName
        - hotelCode
        - hotelName
        - timezone
        - lifecycleStatus
        - collectionEnabled
        - messageEnabled
        - configuredMockConnectors
        - simulationOnly
        - rowVersion
      properties:
        tenantId: {type: string, format: uuid}
        hotelId: {type: string, format: uuid}
        tenantCode: {type: string}
        tenantName: {type: string}
        hotelCode: {type: string}
        hotelName: {type: string}
        timezone: {type: string}
        lifecycleStatus:
          type: string
          enum: [DRAFT, READY_FOR_TEST, SHADOW, UAT, LIVE, PAUSED]
        collectionEnabled: {type: boolean}
        messageEnabled: {type: boolean, const: false}
        configuredMockConnectors: {type: integer, minimum: 0, maximum: 3}
        simulationOnly: {type: boolean, const: true}
        rowVersion: {type: integer, format: int64, minimum: 0}
    SimulationHotelDirectoryView:
      type: object
      additionalProperties: false
      required: [coverage, hotels, failedTenantIds]
      properties:
        coverage: {type: string, enum: [COMPLETE, PARTIAL, UNAVAILABLE]}
        hotels:
          type: array
          items: {$ref: '#/components/schemas/SimulationHotelView'}
        failedTenantIds:
          type: array
          items: {type: string, format: uuid}
    CommandReceiptEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/CommandReceipt'}
    CommandReceipt:
      type: object
      additionalProperties: false
      required: [commandId, resourceId, resultingRowVersion, replayed]
      properties:
        commandId: {type: string, format: uuid}
        resourceId: {type: string, format: uuid}
        resultingRowVersion: {type: integer, format: int64, minimum: 0}
        replayed: {type: boolean}
      example:
        commandId: 0d777b5e-a46f-37a5-824f-f16607e5be35
        resourceId: b6ea0e0e-9a25-3b64-ab35-c96953be0f13
        resultingRowVersion: 1
        replayed: false
    SimulationRunEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/SimulationRunView'}
    SimulationRunListEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/SimulationRunView'}
    SimulationRunView:
      type: object
      additionalProperties: false
      required:
        - runId
        - scenarioCode
        - status
        - fixedClockAt
        - scheduledFor
        - startedAt
        - completedAt
        - briefId
        - incidentIds
        - rowVersion
      properties:
        runId: {type: string, format: uuid}
        scenarioCode:
          type: string
          enum: [BASELINE, INVENTORY_MISMATCH, SOURCE_UNAVAILABLE, LATE_BRIEF_REPLAY]
        status:
          type: string
          enum: [REQUESTED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
        fixedClockAt:
          type: string
          format: date-time
          description: Frozen execution clock used by the deterministic simulation.
        scheduledFor:
          type: string
          format: date-time
          description: Hourly statistics cutoff and the scheduled_for value of the claimed job.
        startedAt: {type: string, format: date-time, nullable: true}
        completedAt: {type: string, format: date-time, nullable: true}
        briefId: {type: string, format: uuid, nullable: true}
        incidentIds:
          type: array
          items: {type: string, format: uuid}
        rowVersion: {type: integer, format: int64, minimum: 0}
    BriefListEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/BriefView'}
    BriefView:
      type: object
      additionalProperties: false
      required:
        - briefId
        - businessDate
        - cutoffAt
        - revisionNo
        - completenessCode
        - content
        - publishedAt
        - simulationRunId
        - deliveryStatus
        - simulationMode
      properties:
        briefId:
          type: string
          format: uuid
          description: hourly_brief_id for the original or adjustment_id for a later version.
        businessDate: {type: string, format: date}
        cutoffAt: {type: string, format: date-time}
        revisionNo: {type: integer, minimum: 1}
        completenessCode: {type: string, enum: [COMPLETE, PARTIAL, UNAVAILABLE]}
        content: {type: string, maxLength: 12000}
        publishedAt: {type: string, format: date-time}
        simulationRunId: {type: string, format: uuid, nullable: true}
        deliveryStatus:
          type: string
          enum: [NOT_QUEUED, PENDING, LEASED, SIMULATED, FAILED, AMBIGUOUS, SKIPPED_OBSOLETE]
        simulationMode: {type: boolean}
    CommandRequest:
      type: object
      required: [expectedRowVersion, reasonCode]
      properties:
        expectedRowVersion: {type: integer, format: int64, minimum: 0}
        reasonCode: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$'}
      additionalProperties: true
    TenantRequest:
      type: object
      additionalProperties: false
      required:
        [expectedRowVersion, reasonCode, tenantCode, displayName, timezone, status]
      properties:
        expectedRowVersion: {type: integer, format: int64, minimum: 0}
        reasonCode: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$'}
        tenantCode:
          type: string
          minLength: 2
          maxLength: 64
          pattern: '^[A-Z0-9][A-Z0-9_-]{1,63}$'
        displayName: {type: string, minLength: 1, maxLength: 160}
        timezone:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z_]+(?:/[A-Za-z_+-]+)+$'
        status: {type: string, enum: [DRAFT, ACTIVE, SUSPENDED]}
      example:
        expectedRowVersion: 0
        reasonCode: INITIAL_SETUP
        tenantCode: SFG_HOTELS
        displayName: 四方馆酒店集团
        timezone: Asia/Shanghai
        status: ACTIVE
    HotelRequest:
      type: object
      additionalProperties: false
      required:
        - expectedRowVersion
        - reasonCode
        - hotelCode
        - displayName
        - timezone
        - lifecycleStatus
        - collectionEnabled
        - messageEnabled
      properties:
        expectedRowVersion: {type: integer, format: int64, minimum: 0}
        reasonCode: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$'}
        hotelCode:
          type: string
          minLength: 2
          maxLength: 64
          pattern: '^[A-Z0-9][A-Z0-9_-]{1,63}$'
        displayName: {type: string, minLength: 1, maxLength: 160}
        timezone:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z_]+(?:/[A-Za-z_+-]+)+$'
        lifecycleStatus:
          type: string
          enum: [DRAFT, READY_FOR_TEST, SHADOW, UAT, LIVE, PAUSED]
        collectionEnabled: {type: boolean}
        messageEnabled: {type: boolean, const: false}
      example:
        expectedRowVersion: 0
        reasonCode: INITIAL_SETUP
        hotelCode: MOOODSHIFT_JFL
        displayName: 解放路MOOODSHIFT酒店
        timezone: Asia/Shanghai
        lifecycleStatus: READY_FOR_TEST
        collectionEnabled: true
        messageEnabled: false
    InventoryPoolRequest:
