      required:
        [expectedRowVersion, reasonCode, businessDate, roomRevenueTarget, targetAdr]
      properties:
        expectedRowVersion: {type: integer, format: int64, minimum: 0}
        reasonCode: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$'}
        businessDate: {type: string, format: date}
        roomRevenueTarget:
          type: number
          exclusiveMinimum: 0
          maximum: 100000000
          multipleOf: 0.01
        targetAdr:
          type: number
          exclusiveMinimum: 0
          maximum: 100000000
          multipleOf: 0.01
      example:
        expectedRowVersion: 0
