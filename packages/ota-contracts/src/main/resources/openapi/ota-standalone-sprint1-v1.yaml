        businessDate: '2026-07-19'
        roomRevenueTarget: 10000.00
        targetAdr: 200.00
    PacePointRequest:
      type: object
      additionalProperties: false
      required: [cutoffLocalTime, revenueProgressPercent, soldProgressPercent]
      properties:
        cutoffLocalTime: {type: string, format: time}
        revenueProgressPercent:
          {type: number, minimum: 0, maximum: 100, multipleOf: 0.0001}
        soldProgressPercent:
          {type: number, minimum: 0, maximum: 100, multipleOf: 0.0001}
    PaceCurveRequest:
      type: object
      additionalProperties: false
      required:
        [expectedRowVersion, reasonCode, curveCode, validFrom, points]
      properties:
        expectedRowVersion: {type: integer, format: int64, minimum: 0}
        reasonCode: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$'}
        curveCode:
          type: string
          minLength: 2
          maxLength: 64
          pattern: '^[A-Z0-9][A-Z0-9_-]{1,63}$'
        validFrom: {type: string, format: date}
        validUntil: {type: string, format: date, nullable: true}
        points:
          type: array
          minItems: 2
          maxItems: 24
          items: {$ref: '#/components/schemas/PacePointRequest'}
      example:
        expectedRowVersion: 0
        reasonCode: PACE_CURVE_SETUP
        curveCode: PEAK_DEFAULT
        validFrom: '2026-07-19'
        validUntil: null
        points:
          - cutoffLocalTime: '17:00:00'
            revenueProgressPercent: 80.0
            soldProgressPercent: 80.0
          - cutoffLocalTime: '18:00:00'
            revenueProgressPercent: 88.2
            soldProgressPercent: 88.2
    ConnectorRequest:
      allOf:
        - {$ref: '#/components/schemas/CommandRequest'}
        - type: object
          required: [adapterCode, sourceCode, enabled, fixtureScenarioCode, pollIntervalMinutes]
          properties:
            adapterCode:
              type: string
              enum: [MOCK_PMS, MOCK_CTRIP, MOCK_MEITUAN, FILE_FIXTURE]
            sourceCode:
              type: string
              enum: [PMS, CTRIP, MEITUAN, OFFICIAL_EXPORT]
            enabled: {type: boolean}
            fixtureScenarioCode: {type: string, maxLength: 64}
            pollIntervalMinutes: {type: integer, minimum: 5, maximum: 60}
            secretReference:
              type: string
              maxLength: 256
              writeOnly: true
          allOf:
            - if:
                properties: {adapterCode: {const: FILE_FIXTURE}}
                required: [adapterCode]
              then:
                properties: {sourceCode: {const: OFFICIAL_EXPORT}}
                not:
                  required: [secretReference]
      example:
        expectedRowVersion: 0
        reasonCode: SIMULATION_BOOTSTRAP
        adapterCode: MOCK_PMS
        sourceCode: PMS
        enabled: true
        fixtureScenarioCode: BASELINE
        pollIntervalMinutes: 60
    SimulationRunRequest:
      allOf:
        - {$ref: '#/components/schemas/CommandRequest'}
        - type: object
          additionalProperties: false
          required: [expectedRowVersion, reasonCode, scenarioCode]
          properties:
            expectedRowVersion: {type: integer, const: 0}
            reasonCode: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$'}
            scenarioCode:
              type: string
              enum: [BASELINE, INVENTORY_MISMATCH, SOURCE_UNAVAILABLE, LATE_BRIEF_REPLAY]
    InitializeSimulationHotelRequest:
      allOf:
