            - expectedRowVersion
            - reasonCode
            - tenantCode
            - tenantDisplayName
            - hotelCode
            - hotelDisplayName
            - timezone
          properties:
            expectedRowVersion: {type: integer, minimum: 0}
            reasonCode: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$'}
            tenantCode: {type: string, maxLength: 64}
            tenantDisplayName: {type: string, maxLength: 160}
            hotelCode: {type: string, maxLength: 64}
            hotelDisplayName: {type: string, maxLength: 160}
            timezone: {type: string, maxLength: 64}
    SecretStatus:
      type: object
      additionalProperties: false
      required: [configured, authorizationStatus]
      properties:
        configured: {type: boolean}
        fingerprint: {type: string, nullable: true}
        authorizationStatus: {type: string}
        lastCheckedAt: {type: string, format: date-time, nullable: true}
