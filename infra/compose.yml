services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hotel_ai_os
      POSTGRES_USER: hotel_ai_os_owner
      POSTGRES_PASSWORD: local-owner-only
    ports:
      - "5432:5432"
    volumes:
      - hotel-ai-os-postgres:/var/lib/postgresql/data
      - ./postgres/00-create-app-role.sql:/docker-entrypoint-initdb.d/00-create-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_ai_os_owner -d hotel_ai_os"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  hotel-ai-os-postgres:

