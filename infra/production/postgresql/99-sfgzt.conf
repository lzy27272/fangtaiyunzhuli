# PostgreSQL 16 baseline for the 4 CPU / 8 GiB Hotel AI OS host.
# Install as /etc/postgresql/16/main/conf.d/99-sfgzt.conf.

# The database is private to the local Core API and administrative SSH sessions.
listen_addresses = '127.0.0.1'
port = 5432
password_encryption = 'scram-sha-256'

max_connections = 50
shared_buffers = 256MB
effective_cache_size = 3GB
work_mem = 4MB
maintenance_work_mem = 64MB

# SSD-oriented planner and checkpoint defaults.
random_page_cost = 1.1
effective_io_concurrency = 200
checkpoint_completion_target = 0.9
wal_compression = on

# Bound abandoned work without imposing a short global statement timeout on
# Flyway migrations or controlled maintenance.
lock_timeout = '10s'
idle_in_transaction_session_timeout = '5min'

timezone = 'Asia/Shanghai'
log_timezone = 'Asia/Shanghai'
log_checkpoints = on
log_lock_waits = on
log_min_duration_statement = 1000
