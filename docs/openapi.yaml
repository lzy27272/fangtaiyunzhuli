  /api/v1/tasks/{taskId}/evidence/{evidenceId}:
    delete:
      tags: [Task Center]
      operationId: deleteTaskEvidence
      summary: Delete pre-submission evidence owned by the exact assignee assignment
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/EvidenceId'
        - name: actorAssignmentId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/tasks/{taskId}/actions/{command}:
    post:
      tags: [Task Center]
      operationId: transitionTask
      summary: Apply an idempotent task state command using expectedVersion
      parameters:
        - $ref: '#/components/parameters/TaskId'
