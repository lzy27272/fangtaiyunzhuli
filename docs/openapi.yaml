  /api/v1/rules/{ruleId}/versions/{versionId}/validate:
    post:
      tags: [Rule Engine]
      operationId: validateRuleVersion
      summary: Validate deterministic condition and action configuration
      parameters:
        - $ref: '#/components/parameters/RuleId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/rules/{ruleId}/versions/{versionId}/simulate:
    post:
      tags: [Rule Engine]
      operationId: simulateRuleVersion
      summary: Simulate a draft or published rule against supplied facts
      parameters:
        - $ref: '#/components/parameters/RuleId'
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleSimulation' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/rules/{ruleId}/versions/{versionId}/publish:
    post:
      tags: [Rule Engine]
      operationId: publishRuleVersion
      summary: Publish a validated rule version using expectedVersion
      parameters:
        - $ref: '#/components/parameters/RuleId'
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishRuleVersion' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/rules/{ruleId}/versions/{versionId}/disable:
    post:
      tags: [Rule Engine]
      operationId: disableRuleVersion
