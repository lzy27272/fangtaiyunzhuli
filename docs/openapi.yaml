    post:
      tags: [Evaluation]
      operationId: createStandardEvaluation
      summary: Create a deterministic standard evaluation idempotently
      description: >-
        Evaluates a submitted work record or a RESULT_SUBMITTED task against its bound,
        published standard version. Manual standard items leave the evaluation in
        PENDING_MANUAL for the manual-review endpoint.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStandardEvaluation' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/standard-evaluations/{evaluationId}:
    get:
      tags: [Evaluation]
      operationId: getStandardEvaluation
      summary: Get evaluation summary and item results
      parameters:
        - $ref: '#/components/parameters/EvaluationId'
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/standard-evaluations/{evaluationId}/manual-review:
    post:
      tags: [Evaluation]
      operationId: reviewStandardEvaluation
      summary: Complete manual evaluation items idempotently using expectedVersion
      parameters:
        - $ref: '#/components/parameters/EvaluationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualEvaluationReview' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/notifications:
    get:
      tags: [Notification]
      operationId: listNotifications
      summary: List notifications for the current account
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
  /api/v1/notifications/{notificationId}/read:
    post:
      tags: [Notification]
      operationId: markNotificationRead
      summary: Mark a notification as read using expectedVersion
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkNotificationRead' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/metrics/definitions:
    get:
      tags: [Metrics]
      operationId: listMetricDefinitions
      summary: List operating metric definitions
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Metrics]
      operationId: createMetricDefinition
      summary: Create an operating metric definition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMetric' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/metrics/observations:
    get:
      tags: [Metrics]
      operationId: listMetricObservations
      summary: List hotel metric observations
      parameters:
        - { name: hotelId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Metrics]
      operationId: createMetricObservation
      summary: Record a hotel metric observation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordObservation' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/dashboards/ceo:
    get:
      tags: [Dashboard]
      operationId: getCeoDashboard
      summary: Get the CEO group dashboard summary
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/dashboards/hotels/{hotelId}:
    get:
      tags: [Dashboard]
      operationId: getHotelDashboard
      summary: Get the general-manager dashboard for one visible hotel
      description: >-
        Returns operating totals plus risk items and all incomplete tasks under the hotel
        organization tree. Risks currently aggregate failed standard evaluations, overdue
        tasks and MISSED work expectations. Requires dashboard.hotel and hotel scope.
      parameters:
        - $ref: '#/components/parameters/HotelId'
      responses:
        '200':
          description: Hotel dashboard with risks and incomplete-task summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HotelDashboard' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/dashboards/operations:
    get:
      tags: [Dashboard]
      operationId: getOperationsDashboard
      summary: Get the regional or operations multi-hotel dashboard
      description: >-
        Returns only hotels visible through the caller's tenant or organization-tree
        scopes. Per-hotel counts cover open tasks, overdue tasks, failed evaluations,
        MISSED work expectations and today's work submissions. Requires dashboard.hotel.
      responses:
        '200':
          description: Scope-filtered multi-hotel operating and risk summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationsDashboard' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/templates:
    get:
      tags: [Enterprise Template]
      operationId: listEnterpriseTemplates
      summary: List task and hotel-dashboard templates visible to the caller
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [TASK, HOTEL_DASHBOARD] }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Enterprise Template]
      operationId: createEnterpriseTemplate
      summary: Create a CEO-managed template and its first draft version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEnterpriseTemplate' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/templates/{templateId}:
    get:
      tags: [Enterprise Template]
      operationId: getEnterpriseTemplate
      summary: Get template metadata and all immutable versions
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/templates/{templateId}/versions:
    post:
      tags: [Enterprise Template]
      operationId: createEnterpriseTemplateVersion
      summary: Create a new editable draft from a published template
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEnterpriseTemplateVersion' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/templates/{templateId}/versions/{versionId}:
    put:
      tags: [Enterprise Template]
      operationId: updateEnterpriseTemplateVersion
      summary: Update an editable template draft using optimistic locking
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEnterpriseTemplateVersion' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/templates/{templateId}/versions/{versionId}/publish:
    post:
      tags: [Enterprise Template]
      operationId: publishEnterpriseTemplateVersion
      summary: Publish a template version and retire the preceding published version
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishEnterpriseTemplateVersion' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Trusted production JWT or SSO access token.
    TenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
      description: Local integration only; requires DEV_HEADER_AUTH_ENABLED=true.
    ActorHeader:
      type: apiKey
      in: header
      name: X-Actor-Id
      description: Local integration only; requires DEV_HEADER_AUTH_ENABLED=true.
  parameters:
    EmployeeId: { name: employeeId, in: path, required: true, schema: { type: string, format: uuid } }
    RoleId: { name: roleId, in: path, required: true, schema: { type: string, format: uuid } }
    StandardId: { name: standardId, in: path, required: true, schema: { type: string, format: uuid } }
    TemplateId: { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
    EvidenceId: { name: evidenceId, in: path, required: true, schema: { type: string, format: uuid } }
    VersionId: { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    FormId: { name: formId, in: path, required: true, schema: { type: string, format: uuid } }
    RecordId: { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    AttachmentId: { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
    WorkPackageId: { name: workPackageId, in: path, required: true, schema: { type: string, format: uuid } }
    ExpectationId: { name: expectationId, in: path, required: true, schema: { type: string, format: uuid } }
    RuleId: { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
    EventId: { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    TaskId: { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    EvaluationId: { name: evaluationId, in: path, required: true, schema: { type: string, format: uuid } }
    NotificationId: { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
    HotelId: { name: hotelId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key; reuse returns the original semantic result.
      schema: { type: string, minLength: 1, maxLength: 255 }
  responses:
    ListResponse:
      description: List response
      content:
        application/json:
          schema:
            type: array
            items: { type: object, additionalProperties: true }
    ObjectResponse:
      description: Object response
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    Problem:
      description: RFC 9457 problem detail
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, invalid or inactive identity
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Permission denied or organization scope violation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Optimistic version or idempotency conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    EffectiveIdentity:
      type: object
      required: [tenantId, account, roles, permissions, tenantScope, organizationScopes, positionAssignments]
      properties:
        tenantId: { type: string, format: uuid }
        account: { type: object, additionalProperties: true }
        employee: { type: [object, 'null'], additionalProperties: true }
        primaryRole: { type: [string, 'null'] }
        roles: { type: array, uniqueItems: true, items: { type: string } }
        permissions: { type: array, uniqueItems: true, items: { type: string } }
        tenantScope: { type: boolean }
        organizationScopes: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
        positionAssignments: { type: array, items: { type: object, additionalProperties: true } }
    CreateOrgUnit:
      type: object
      required: [code, name, unitType]
      properties:
        parentId: { type: [string, 'null'], format: uuid }
        code: { type: string }
        name: { type: string }
