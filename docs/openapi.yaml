        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Task Center]
      operationId: createTask
      summary: Create a task idempotently
      description: Assignee and reviewer must resolve to different active position assignments in scope.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTask' }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/tasks/{taskId}:
    get:
      tags: [Task Center]
      operationId: getTask
      summary: Get task details and exact assignment participants
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
  /api/v1/tasks/{taskId}/timeline:
    get:
      tags: [Task Center]
      operationId: getTaskTimeline
