      parameters:
        - $ref: '#/components/parameters/RuleId'
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRuleVersion' }
