      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCommand' }
      responses:
        '200': { $ref: '#/components/responses/ObjectResponse' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/tasks/sla/process:
    post:
      tags: [Task Center]
      operationId: processTaskSla
      summary: Mark overdue tasks and execute due escalation actions
      description: >-
        Requires task.dispatch. Marks active due tasks OVERDUE, records timeline entries,
        notifies reviewers, cancels scheduled escalations for terminal tasks, and executes
        due escalation rows with assignment-level notifications. Repeated processing does
        not repeat already executed or cancelled escalation rows.
      responses:
        '200':
          description: Counts produced by this processing pass
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskSlaProcessResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/standard-evaluations:
