          in: query
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { $ref: '#/components/responses/ObjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/tasks/{taskId}/evidence/{evidenceId}/content:
    get:
      tags: [Task Center]
      operationId: downloadTaskEvidence
      summary: Download visible task evidence
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/EvidenceId'
